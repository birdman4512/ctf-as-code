<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTF Portal</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101316;
      --panel: #181d21;
      --panel-2: #20272d;
      --text: #edf2f4;
      --muted: #aeb8c2;
      --line: #323c45;
      --accent: #2dd4bf;
      --accent-2: #f59e0b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    header {
      display: grid;
      gap: 14px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.5rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .lede {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      padding-top: 28px;
    }

    .card {
      min-height: 210px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .card[data-disabled="true"] {
      background: var(--panel-2);
    }

    .group {
      width: fit-content;
      padding: 4px 8px;
      color: var(--bg);
      background: var(--accent);
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .card[data-disabled="true"] .group {
      background: var(--accent-2);
    }

    h2 {
      margin: 16px 0 8px;
      font-size: 1.35rem;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    a,
    .disabled-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 6px;
      font-weight: 700;
      text-decoration: none;
    }

    a {
      color: var(--bg);
      background: var(--text);
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .disabled-link {
      color: var(--muted);
      border: 1px solid var(--line);
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1 id="portal-title">CTF Portal</h1>
      <p id="portal-description" class="lede">Jump into the competition platform, DNS admin, and any event resources published for this CTF.</p>
    </header>

    <section id="resources" class="grid" aria-label="CTF resources"></section>
  </main>

  <script>
    const container = document.querySelector("#resources");
    const portalTitle = document.querySelector("#portal-title");
    const portalDescription = document.querySelector("#portal-description");

    function card(resource) {
      const article = document.createElement("article");
      article.className = "card";
      article.dataset.disabled = resource.disabled ? "true" : "false";

      const content = document.createElement("div");
      const group = document.createElement("div");
      group.className = "group";
      group.textContent = resource.group || "Resource";

      const title = document.createElement("h2");
      title.textContent = resource.title;

      const description = document.createElement("p");
      description.textContent = resource.description;

      content.append(group, title, description);

      if (resource.disabled) {
        const disabled = document.createElement("span");
        disabled.className = "disabled-link";
        disabled.textContent = resource.label || "Unavailable";
        article.append(content, disabled);
      } else {
        const link = document.createElement("a");
        link.href = resource.href;
        link.textContent = resource.label || "Open";
        article.append(content, link);
      }

      return article;
    }

    fetch("/resources.json")
      .then((response) => response.json())
      .then((config) => {
        const resources = Array.isArray(config) ? config : config.resources || [];
        const title = Array.isArray(config) ? "CTF Portal" : config.title || "CTF Portal";
        const description = Array.isArray(config)
          ? "Jump into the competition platform, DNS admin, and any event resources published for this CTF."
          : config.description || "";

        document.title = title;
        portalTitle.textContent = title;
        portalDescription.textContent = description;
        portalDescription.hidden = description.length === 0;
        container.replaceChildren(...resources.map(card));
      })
      .catch(() => {
        container.textContent = "Resource list could not be loaded.";
      });
  </script>
</body>
</html>
