name: Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Validate Compose and manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Docker Compose config
        run: docker compose --env-file .env.example config

      - name: Compile Python scripts
        run: python -m py_compile scripts/sync-challenges.py scripts/validate-manifests.py

      - name: Validate CTFd manifests
        run: python scripts/validate-manifests.py --load-manifest ctfd-load.example.json
